name: Check Amazon Jobs
on:
  schedule:
    - cron: '*/30 * * * *' # Changed to run every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run tracker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python tracker.py
        
      - name: Commit seen jobs
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          # Touch ensures the file exists before we try to add it
          touch seen_jobs.txt
          git add seen_jobs.txt
          git commit -m "Update seen jobs database" || exit 0
          git push